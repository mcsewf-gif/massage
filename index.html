<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>按摩卡余量管理</title>
  
  <!-- PWA 支持配置 -->
  <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22按摩卡管理%22,%22short_name%22:%22按摩卡%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%23f4f6f9%22,%22theme_color%22:%22%232c3e50%22}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#2c3e50">

  <style>
    :root {
      --primary-color: #2c3e50;
      --accent-color: #3498db;
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); padding: 15px; padding-bottom: 40px; }
    
    .card { background: var(--card-bg); border-radius: 12px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    
    /* 头部剩余时间 */
    .dashboard { text-align: center; background: linear-gradient(135deg, #2c3e50, #3498db); color: #fff; }
    .dashboard h2 { font-size: 14px; opacity: 0.8; font-weight: normal; margin-bottom: 5px; }
    .balance-display { font-size: 38px; font-weight: bold; margin: 5px 0; }
    .balance-details { font-size: 14px; opacity: 0.9; }

    /* 快捷按钮 */
    .quick-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
    .btn-person { background: #fff; border: 2px solid var(--accent-color); color: var(--accent-color); border-radius: 10px; padding: 15px 10px; font-size: 18px; font-weight: bold; cursor: pointer; text-align: center; transition: all 0.2s; }
    .btn-person:active { background: var(--accent-color); color: #fff; transform: scale(0.98); }

    /* 表单与设置 */
    label { display: block; font-size: 12px; color: #666; margin-top: 10px; margin-bottom: 4px; font-weight: bold; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; background: #fff; }
    textarea { resize: vertical; height: 60px; }
    
    .inline-group { display: flex; gap: 10px; }
    .inline-group > div { flex: 1; }

    .btn { background: var(--accent-color); color: white; border: none; padding: 12px; border-radius: 6px; font-size: 15px; font-weight: bold; width: 100%; margin-top: 15px; cursor: pointer; }
    .btn:active { opacity: 0.9; }
    .btn-secondary { background: #e74c3c; }
    .btn-outline { background: transparent; border: 1px solid var(--primary-color); color: var(--primary-color); }
    .btn-add-opt { width: 35px; margin-top: 0; margin-left: 5px; flex-shrink: 0; }

    /* 记录列表 */
    .history-item { border-bottom: 1px solid #eee; padding: 12px 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .history-item:last-child { border-bottom: none; }
    .history-left { flex: 1; }
    .history-main { font-size: 15px; font-weight: bold; margin-bottom: 4px; }
    .history-info-row { font-size: 13px; color: #555; display: flex; flex-wrap: wrap; gap: 12px; margin-top: 2px; }
    .history-note { font-size: 12px; color: #777; margin-top: 4px; }
    
    /* 右侧变动时长单行显示 */
    .history-right { text-align: right; flex-shrink: 0; white-space: nowrap; }
    .history-amount { font-weight: bold; font-size: 14px; }

    /* 折叠面板 */
    details { margin-bottom: 15px; }
    summary { font-weight: bold; padding: 10px; background: #fff; border-radius: 8px; cursor: pointer; color: var(--primary-color); }
    
    .flex-row { display: flex; align-items: center; }
  </style>
</head>
<body>

  <!-- 顶部余量展示 -->
  <div class="card dashboard">
    <h2>卡内剩余总时长</h2>
    <div class="balance-display" id="dispTotalMinutes">0 分钟</div>
    <div class="balance-details" id="dispHours">约 0 小时 0 分钟</div>
  </div>

  <!-- 快速选择区域 -->
  <div class="quick-actions">
    <button class="btn-person" onclick="openRecordForm('Michael')">Michael</button>
    <button class="btn-person" onclick="openRecordForm('Mabel')">Mabel</button>
  </div>

  <!-- 消费/新增记录表单 -->
  <div class="card" id="recordCard" style="display: none;">
    <h3 id="formTitle">新增消费记录</h3>
    
    <label>打卡人</label>
    <input type="text" id="recUser" readonly style="background: #eee;">

    <div class="inline-group">
      <div>
        <label>扣除时长 (分钟)</label>
        <input type="number" id="recDuration" value="45">
      </div>
      <div>
        <label>日期</label>
        <input type="date" id="recDate">
      </div>
    </div>

    <label>门店地点</label>
    <div class="flex-row">
      <select id="recLocation"></select>
      <button class="btn btn-add-opt" onclick="addOption('location')">+</button>
    </div>

    <label>按摩师</label>
    <div class="flex-row">
      <select id="recMasseuse"></select>
      <button class="btn btn-add-opt" onclick="addOption('masseuse')">+</button>
    </div>

    <label>备注</label>
    <textarea id="recNote" placeholder="例如：肩颈重点放松..."></textarea>

    <div class="inline-group">
      <button class="btn" onclick="saveRecord()">确认扣除</button>
      <button class="btn btn-secondary" onclick="closeRecordForm()">取消</button>
    </div>
  </div>

  <!-- 卡余额充值/设置 -->
  <details>
    <summary>卡内充值与增加时长</summary>
    <div class="card" style="margin-top: 10px;">
      <label>增加/充值分钟数</label>
      <input type="number" id="topupAmount" placeholder="例如：300">
      <label>充值备注</label>
      <input type="text" id="topupNote" placeholder="例如：充值新会员卡">
      <button class="btn" onclick="addTopup()">确认充值</button>
    </div>
  </details>

  <!-- 历史记录列表 -->
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
      <h3>消费与充值明细</h3>
      <button class="btn btn-outline" style="width: auto; padding: 5px 10px; font-size: 12px; margin-top: 0;" onclick="exportToExcel()">导出 Excel</button>
    </div>
    <div id="historyList"></div>
  </div>

  <script>
    // 初始与存储数据结构
    let state = {
      balance: 0,
      locations: ["Hwy7", "Warden"],
      masseuses: ["Emily", "Cindy"],
      logs: []
    };

    const WEEK_DAYS = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];

    // 页面加载初始化
    window.onload = function() {
      loadData();
      renderOptions();
      updateDashboard();
      renderHistory();
      
      // 设置默认日期为今天
      document.getElementById('recDate').value = new Date().toISOString().split('T')[0];
    };

    // 数据持久化（升级存储键名，清空乱码历史）
    function saveData() {
      localStorage.setItem('massage_app_v2', JSON.stringify(state));
      updateDashboard();
      renderHistory();
    }

    function loadData() {
      const saved = localStorage.getItem('massage_app_v2');
      if (saved) {
        state = JSON.parse(saved);
      }
    }

    // 更新 Dashboard 显示
    function updateDashboard() {
      const total = state.balance;
      document.getElementById('dispTotalMinutes').innerText = `${total} 分钟`;
      const hrs = Math.floor(total / 60);
      const mins = total % 60;
      document.getElementById('dispHours').innerText = `约 ${hrs} 小时 ${mins} 分钟`;
    }

    // 渲染下拉框选项
    function renderOptions() {
      const locSelect = document.getElementById('recLocation');
      locSelect.innerHTML = state.locations.map(l => `<option value="${l}">${l}</option>`).join('');

      const masSelect = document.getElementById('recMasseuse');
      masSelect.innerHTML = state.masseuses.map(m => `<option value="${m}">${m}</option>`).join('');
    }

    // 动态添加地点或按摩师
    function addOption(type) {
      const name = prompt(type === 'location' ? "请输入新地点名称:" : "请输入新按摩师名字:");
      if (name && name.trim()) {
        const cleanName = name.trim();
        if (type === 'location' && !state.locations.includes(cleanName)) {
          state.locations.push(cleanName);
        } else if (type === 'masseuse' && !state.masseuses.includes(cleanName)) {
          state.masseuses.push(cleanName);
        }
        saveData();
        renderOptions();
      }
    }

    // 打开消费表单
    function openRecordForm(user) {
      document.getElementById('recUser').value = user;
      document.getElementById('recDuration').value = 45;
      document.getElementById('recDate').value = new Date().toISOString().split('T')[0];
      document.getElementById('recNote').value = '';
      document.getElementById('recordCard').style.display = 'block';
      window.scrollTo({ top: document.getElementById('recordCard').offsetTop - 20, behavior: 'smooth' });
    }

    function closeRecordForm() {
      document.getElementById('recordCard').style.display = 'none';
    }

    // 保存消费记录
    function saveRecord() {
      const duration = parseInt(document.getElementById('recDuration').value) || 0;
      if (duration <= 0) {
        alert("请输入正确的扣除时长");
        return;
      }

      const dateStr = document.getElementById('recDate').value;
      const dateObj = new Date(dateStr + "T00:00:00");
      const dayOfWeek = WEEK_DAYS[dateObj.getDay()];

      const log = {
        id: Date.now(),
        type: 'consume',
        user: document.getElementById('recUser').value,
        duration: duration,
        date: dateStr,
        dayOfWeek: dayOfWeek,
        location: document.getElementById('recLocation').value,
        masseuse: document.getElementById('recMasseuse').value,
        note: document.getElementById('recNote').value
      };

      state.balance -= duration;
      state.logs.unshift(log);
      saveData();
      closeRecordForm();
    }

    // 充值卡时长
    function addTopup() {
      const amount = parseInt(document.getElementById('topupAmount').value) || 0;
      const note = document.getElementById('topupNote').value;
      
      if (amount <= 0) {
        alert("请输入有效的充值分钟数");
        return;
      }

      const today = new Date();
      const dateStr = today.toISOString().split('T')[0];
      
      const log = {
        id: Date.now(),
        type: 'topup',
        user: '充值',
        duration: amount,
        date: dateStr,
        dayOfWeek: WEEK_DAYS[today.getDay()],
        location: '-',
        masseuse: '-',
        note: note || '卡内充值'
      };

      state.balance += amount;
      state.logs.unshift(log);
      saveData();
      
      document.getElementById('topupAmount').value = '';
      document.getElementById('topupNote').value = '';
      alert(`成功增加 ${amount} 分钟！`);
    }

    // 删除单条记录
    function deleteLog(id) {
      if (!confirm("确定要删除这条记录吗？相关时长将被自动退回/扣除。")) return;
      
      const idx = state.logs.findIndex(l => l.id === id);
      if (idx !== -1) {
        const item = state.logs[idx];
        if (item.type === 'consume') {
          state.balance += item.duration;
        } else if (item.type === 'topup') {
          state.balance -= item.duration;
        }
        state.logs.splice(idx, 1);
        saveData();
      }
    }

    // 渲染历史明细（全面摒弃旧字符串拼接，解决乱码）
    function renderHistory() {
      const container = document.getElementById('historyList');
      if (state.logs.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:#999; padding:20px 0;">暂无记录</div>';
        return;
      }

      container.innerHTML = state.logs.map(log => {
        const isTopup = log.type === 'topup';
        
        let subContent = '';
        if (isTopup) {
          subContent = `<div class="history-note">📝 ${log.note}</div>`;
        } else {
          subContent = `
            <div class="history-info-row">
              <span>📍 ${log.location}</span>
              <span>💆 ${log.masseuse}</span>
            </div>
            ${log.note ? `<div class="history-note">📝 ${log.note}</div>` : ''}
          `;
        }

        return `
          <div class="history-item">
            <div class="history-left">
              <div class="history-main">
                👤 ${isTopup ? '充值' : log.user} 
                <span style="font-size:12px; font-weight:normal; color:#666;">(${log.date} ${log.dayOfWeek})</span>
              </div>
              ${subContent}
            </div>
            <div class="history-right">
              <div class="history-amount" style="color: ${isTopup ? '#2ecc71' : '#e74c3c'}">
                ${isTopup ? '+' : '-'}${log.duration} 分钟
              </div>
              <button onclick="deleteLog(${log.id})" style="background:none; border:none; color:#bbb; font-size:12px; margin-top:4px; cursor:pointer;">删除</button>
            </div>
          </div>
        `;
      }).join('');
    }

    // 导出 Excel
    function exportToExcel() {
      if (state.logs.length === 0) {
        alert("没有可导出的记录！");
        return;
      }

      let csvContent = "\uFEFF";
      csvContent += "日期,星期,类型/使用者,变动分钟数,地点,按摩师,备注\n";

      state.logs.forEach(log => {
        const typeStr = log.type === 'topup' ? '充值' : log.user;
        const durationStr = log.type === 'topup' ? `+${log.duration}` : `-${log.duration}`;
        const noteClean = (log.note || '').replace(/,/g, ' ');
        
        csvContent += `"${log.date}","${log.dayOfWeek}","${typeStr}","${durationStr}","${log.location}","${log.masseuse}","${noteClean}"\n`;
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `按摩卡消费记录_${new Date().toISOString().split('T')[0]}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
